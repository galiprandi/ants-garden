name: 🐜 Ants Colony

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      name:
        description: 'ID de la Hormiga (ej. carol, uma)'
        required: true
        type: string

jobs:
  working:
    name: 🐜 Ant Mission
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ANTS_AI_KEY: ${{ secrets.ANTS_AI_KEY }}
    
    steps:
      - name: 🕳️ Descending into the Anthill
        uses: actions/checkout@v6

      - name: 🆔 Pheromone Identification
        id: identify
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            AGENT_NAME="${{ github.event.inputs.name }}"
            echo "AGENTE=$AGENT_NAME" >> $GITHUB_ENV
            echo "📢 Llamado directo para la hormiga: $AGENT_NAME"
          else
            AUTHOR_NAME=$(gh pr view ${{ github.event.pull_request.number }} --json commits --jq '.commits[-1].commit.author.name')
            if [[ "$AUTHOR_NAME" =~ 🐜\ (.+) ]]; then
              echo "AGENTE=${BASH_REMATCH[1]}" >> $GITHUB_ENV
              echo "🧬 ADN detectado: Hormiga ${BASH_REMATCH[1]}"
            else
              echo "❌ Intruso detectado: El formato del autor debe ser '🐜 [NAME]'"
              exit 1
            fi
          fi

      - name: 🛡️ Territory Inspection (PR Limit)
        run: |
          ANT="${{ env.AGENTE }}"
          OPEN_PRS=$(gh pr list --state open --repo ${{ github.repository }} --search "author:🐜 $ANT" --json number --jq '. | length')
          if [ "$OPEN_PRS" -ge 2 ]; then
            echo "🚨 Saturación de túneles: $ANT ya tiene $OPEN_PRS misiones activas."
            exit 1
          fi

      - name: ⚒️ Equipping the Mandibles
        run: |
          git config --global user.name "🐜 ${{ env.AGENTE }}"
          git config --global user.email "${{ env.AGENTE }}@ants.io"

      - name: 🧠 Synaptic Link (Loading Brain)
        id: ant-brain
        run: |
          # Normalizar nombre del archivo a minúsculas
          FILE_NAME=$(echo "${{ env.AGENTE }}" | tr '[:upper:]' '[:lower:]')
          BRAIN_FILE=".ants/gallery/${FILE_NAME}.md"
          
          if [ ! -f "$BRAIN_FILE" ]; then 
            echo "❌ Error: La memoria $BRAIN_FILE no está en la galería."
            exit 1 
          fi
          
          # Técnica multilínea robusta para GITHUB_OUTPUT
          {
            echo "prompt<<EOF"
            cat "$BRAIN_FILE"
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          
          echo "🧠 Memoria de $FILE_NAME cargada en los ganglios."

      - name: 🐜 Awakening the Drone
        uses: 'google-github-actions/run-gemini-cli@v0'
        env:
          GEMINI_CLI_TRUST_WORKSPACE: true
        with:
          gemini_api_key: ${{ secrets.ANTS_AI_KEY }}
          gemini_model: 'gemma-4-26b-a4b-it'
          prompt: ${{ steps.ant-brain.outputs.prompt }}

      - name: 🏁 Mission Accomplished
        run: echo "🍂 Recolección finalizada para ${{ env.AGENTE }}."