name: 🐜 Ants

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      ant_name:
        description: 'Nombre de la hormiga (ej. carol, uma)'
        required: true
        type: string

jobs:
  ant-process:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ANTS_AI_KEY: ${{ secrets.ANTS_AI_KEY }}
      ANTS_AI_MODEL: ${{ secrets.ANTS_AI_MODEL }}
    
    steps:
      # 0. CHECKOUT (Requerido antes de usar gh)
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 1. DETECCIÓN DEL AGENTE (por name)
      - name: Identificar Hormiga
        id: identify
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "AGENTE=${{ inputs.ant_name }}" >> $GITHUB_ENV
            echo "Es ejecución manual para: ${{ inputs.ant_name }}"
          else
            # Extraer el nombre del git user del autor del PR
            AUTHOR_NAME=$(gh pr view ${{ github.event.pull_request.number }} --json commits --jq '.commits[-1].commit.author.name')
            # Formato esperado: "🐜 [ANT_NAME]"
            if [[ "$AUTHOR_NAME" =~ 🐜\ (.+) ]]; then
              echo "AGENTE=${BASH_REMATCH[1]}" >> $GITHUB_ENV
            else
              echo "❌ Error: El formato del author name debe ser '🐜 [ANT_NAME]', got: $AUTHOR_NAME"
              exit 1
            fi
          fi

      # 2. VALIDACIÓN DE PRs ABIERTOS
      - name: Validar PRs Abiertos
        id: validator
        run: |
          ANT="${{ env.AGENTE }}"
          echo "Validando para la hormiga: $ANT"

          # Contar PRs ABIERTOS de esta hormiga (por author name)
          OPEN_PRS=$(gh pr list --state open --repo ${{ github.repository }} --search "author:🐜 $ANT" --json number --jq '. | length')
          
          if [ "$OPEN_PRS" -ge 2 ]; then
            echo "🚨 La hormiga $ANT ya tiene $OPEN_PRS PRs abiertos. Límite >= 2 alcanzado. Abortando."
            exit 1
          fi

          echo "✅ Validación pasada: $OPEN_PRS PR(s) abierto(s) de $ANT"

      # 3. SETUP Y CONFIGURACIÓN
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validar existencia de archivo .md
        run: |
          FILE=".ants/gallery/${{ env.AGENTE }}.md"
          if [ ! -f "$FILE" ]; then
            echo "❌ Error: El archivo $FILE no existe."
            exit 1
          fi

      - name: Configurar Git y OpenCode
        run: |
          git config --global user.name "🐜 ${{ env.AGENTE }}"
          git config --global user.email "${{ env.AGENTE }}@ants.io"
          npm install -g opencode
          npm install

      # 4. EJECUCIÓN
      - name: Run OpenCode Agent
        run: |
          opencode run ".ants/gallery/${{ env.AGENTE }}.md"
        env:
          API_KEY: ${{ secrets.ANTS_AI_KEY }}
          MODEL: ${{ secrets.ANTS_AI_MODEL }}
          PROVIDER: google
